<meta charset="utf-8">
<title>Watch It Grow — a model learns the news, live</title>
<style>
  :root {
    --paper: #f4f4f0; --ink: #1c2128; --ink-soft: #57606a;
    --rule: #d8d8d2; --card: #ffffff;
    --pass: #2da44e; --pass-ink: #1a7f37; --pass-soft: #dafbe1;
    --fail: #cf222e; --fail-soft: #ffebe9;
    --bill: #9a6700; --bill-soft: #fff8c5;
    --term-bg: #10141a; --term-text: #c9d1d9; --term-dim: #768390;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14161a; --ink: #e6e8eb; --ink-soft: #9aa4af;
      --rule: #2b3138; --card: #1b1f26;
      --pass: #3fb950; --pass-ink: #3fb950; --pass-soft: #12261a;
      --fail: #f85149; --fail-soft: #2d1517;
      --bill: #d29922; --bill-soft: #2b2413;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14161a; --ink: #e6e8eb; --ink-soft: #9aa4af;
    --rule: #2b3138; --card: #1b1f26;
    --pass: #3fb950; --pass-ink: #3fb950; --pass-soft: #12261a;
    --fail: #f85149; --fail-soft: #2d1517;
    --bill: #d29922; --bill-soft: #2b2413;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.6 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 780px; margin: 0 auto; padding: 40px 20px 80px; }
  header { border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 12px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-soft); margin: 0 0 10px; }
  h1 { font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(27px, 5vw, 40px); line-height: 1.14; margin: 0 0 10px;
    letter-spacing: 0; text-wrap: balance; font-weight: 400; }
  .lede { color: var(--ink-soft); margin: 0; max-width: 60ch; font-size: 15.5px; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 34px; }
  .fact { background: var(--card); border: 1px solid var(--rule); border-radius: 999px;
    padding: 5px 14px; font-size: 13.5px; }
  .fact b { font-weight: 650; }
  .fact .n { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px;
    color: var(--ink-soft); letter-spacing: .06em; margin-right: 5px; }
  .act { display: grid; grid-template-columns: 84px 1fr; gap: 0 18px;
    padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .actno { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft);
    padding-top: 4px; }
  .act h2 { font-size: 17px; margin: 0 0 6px; font-weight: 650; }
  .meters { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px;
    font-variant-numeric: tabular-nums; }
  .chip { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    font-weight: 700; padding: 3px 12px; border-radius: 6px; }
  .knows { background: var(--pass-soft); color: var(--pass-ink); }
  .knows.zero { background: transparent; color: var(--ink-soft);
    border: 1px dashed var(--rule); }
  .dmg { background: var(--fail-soft); color: var(--fail); }
  .dmg.zero { background: var(--pass-soft); color: var(--pass-ink); }
  .note { color: var(--ink-soft); font-size: 14px; margin: 2px 0 0; max-width: 60ch; }
  .rounds { background: var(--card); border: 1px solid var(--rule); border-radius: 8px;
    padding: 12px 16px; margin-top: 10px; }
  .rounds table { border-collapse: collapse; width: 100%;
    font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .rounds th { text-align: left; font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-soft); padding: 2px 10px 6px 0; }
  .rounds td { font-family: ui-monospace, Consolas, monospace; font-size: 13px;
    padding: 3px 10px 3px 0; }
  .heal { color: var(--pass-ink); font-weight: 700; }
  .wound { color: var(--fail); font-weight: 700; }
  .zero-cell { color: var(--pass-ink); font-weight: 700; }
  .term { background: var(--term-bg); color: var(--term-text); border-radius: 6px;
    padding: 14px 18px; overflow-x: auto; font-family: ui-monospace, Consolas, monospace;
    font-size: 12.5px; line-height: 1.5; margin: 26px 0; }
  .term pre { margin: 0; white-space: pre; }
  .t-pass { color: #3fb950; font-weight: 700; }
  .voice { background: var(--term-bg); color: var(--term-text); border-radius: 6px;
    padding: 10px 14px; margin: 10px 0 4px; overflow-x: auto;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; line-height: 1.55; }
  .voice pre { margin: 0; white-space: pre-wrap; }
  .v-label { color: var(--term-dim); }
  .v-right { color: #3fb950; }
  .v-wrong { color: #f85149; }
  footer { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 30px;
    font-size: 13px; color: var(--ink-soft); }
  footer code { font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    color: var(--ink); }
  .controls { display: none; gap: 10px; margin: 0 0 26px; }
  .controls.js { display: flex; }
  .btn { font: 600 14px/1 "Segoe UI", system-ui, sans-serif; padding: 10px 18px;
    border-radius: 8px; border: 1.5px solid var(--ink); background: var(--ink);
    color: var(--paper); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:focus-visible { outline: 3px solid var(--pass); outline-offset: 2px; }
  .hidden-row { visibility: hidden; }
  @media (prefers-reduced-motion: no-preference) {
    .act.on, .term.on { animation: rise .45s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); }
                      to { opacity: 1; transform: none; } }
  }
</style>
